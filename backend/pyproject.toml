[project]
name = "cadence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "websockets>=16.1.1",
    "httpx2>=2.10.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
eval = [
    "google-genai>=2.17.0",
]
